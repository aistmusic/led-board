<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050507" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>LED Board</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#050507; --panel:#0c0d12; --card:#16171f; --line:#2c3040; --text:#f4f5f7; --muted:#8b90a2; --accent:#ffd84a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif; }
    body { display:flex; flex-direction:column; min-height:100dvh; }
    .board-wrap { flex:1; display:flex; min-height:0; }
    .board { flex:1; background:#050506; }
    canvas { width:100%; height:100%; display:block; touch-action:manipulation; }
    .rotate { display:none; position:fixed; inset:0; z-index:30; background:#050507; color:#fff; align-items:center; justify-content:center; text-align:center; padding:24px; font-size:18px; font-weight:650; }
    @media (orientation:portrait) and (max-width:700px) { .rotate { display:flex; } }
    @media (orientation:landscape) {
      body { flex-direction:row; }
      .board-wrap { height:100dvh; }
      .panel { width:min(300px,36vw); max-height:100dvh; overflow:auto; border-top:0; border-left:1px solid var(--line); }
    }
    .panel { padding:12px 12px calc(14px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); display:grid; gap:9px; }
    .brand { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700; }
    .msg { width:100%; min-height:44px; border:1px solid var(--line); background:var(--card); color:#fff; border-radius:11px; padding:11px 12px; font-size:16px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .ctl { background:var(--card); border:1px solid var(--line); border-radius:11px; padding:8px; }
    .ctl label { display:block; font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .step { display:grid; grid-template-columns:44px 1fr 44px; gap:6px; align-items:center; }
    .step b { text-align:center; font-size:16px; font-variant-numeric:tabular-nums; }
    .pm { min-height:44px; min-width:44px; padding:0; font-size:22px; line-height:1; background:#1d1f28; color:#fff; border:1px solid var(--line); border-radius:10px; }
    .color-wrap { display:flex; align-items:center; gap:10px; }
    .color-round { -webkit-appearance:none; appearance:none; width:52px; height:52px; padding:0; border:0; border-radius:50%; overflow:hidden; background:transparent; }
    .color-round::-webkit-color-swatch-wrapper { padding:0; border:none; }
    .color-round::-webkit-color-swatch { border:none; border-radius:50%; }
    .color-round::-moz-color-swatch { border:none; border-radius:50%; }
    .actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; }
    button { min-height:44px; border:0; border-radius:11px; background:var(--accent); color:#111; font-weight:800; font-size:13px; }
    button.ghost { background:var(--card); color:var(--text); border:1px solid var(--line); }
    button.on { background:#3a3210; color:#ffe58a; border-color:#6a5a18; }
    .hint { font-size:11px; color:var(--muted); text-align:center; line-height:1.35; }
    body.fs .panel { display:none !important; }
    body.fs .board-wrap { height:100dvh; }
  </style>
</head>
<body>
  <div class="board-wrap"><div class="board"><canvas id="led" aria-label="Tablica LED"></canvas></div></div>
  <form class="panel" id="form">
    <div class="brand">LED Board</div>
    <input id="msg" class="msg" type="text" autocomplete="off" maxlength="240" value="CO SLYCHAC?" />
    <div class="grid2">
      <div class="ctl"><label>Wielkość</label><div class="step"><button type="button" class="pm" data-for="size" data-dir="-">−</button><b id="sizeVal">4</b><button type="button" class="pm" data-for="size" data-dir="+">+</button></div><input id="size" type="hidden" min="1" max="8" step="1" value="4" /></div>
      <div class="ctl"><label>Grubość</label><div class="step"><button type="button" class="pm" data-for="thick" data-dir="-">−</button><b id="thickVal">78</b><button type="button" class="pm" data-for="thick" data-dir="+">+</button></div><input id="thick" type="hidden" min="35" max="96" step="5" value="78" /></div>
      <div class="ctl"><label>Odstęp</label><div class="step"><button type="button" class="pm" data-for="gap" data-dir="-">−</button><b id="gapVal">1</b><button type="button" class="pm" data-for="gap" data-dir="+">+</button></div><input id="gap" type="hidden" min="0" max="5" step="1" value="1" /></div>
      <div class="ctl"><label>Prędkość</label><div class="step"><button type="button" class="pm" data-for="speed" data-dir="-">−</button><b id="speedVal">16</b><button type="button" class="pm" data-for="speed" data-dir="+">+</button></div><input id="speed" type="hidden" min="2" max="80" step="2" value="16" /></div>
    </div>
    <div class="ctl"><label>Kolor</label><div class="color-wrap"><input id="color" class="color-round" type="color" value="#ff3b30" /><span class="hint" style="text-align:left">Dotknij koła</span></div></div>
    <div class="actions">
      <button type="submit">Start</button>
      <button type="button" class="ghost" id="pause">Pauza</button>
      <button type="button" class="ghost" id="bold">Bold</button>
    </div>
    <button type="button" class="ghost" id="fs">Pełny ekran</button>
    <p class="hint">Obróć poziomo. W pełnym tap na tablicę wraca do ustawień.</p>
  </form>
  <div class="rotate">Obróć telefon poziomo</div>
  <script src="app.js"></script>
</body>
</html>
