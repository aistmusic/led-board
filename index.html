<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050507" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>LED Board</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#050507; --panel:#0d0e13; --card:#15161d; --line:#2a2d38; --text:#f4f5f7; --muted:#8d92a3; --accent:#ff3b30; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif; }
    body { display:flex; flex-direction:column; min-height:100dvh; }
    .board-wrap { flex:1; display:flex; min-height:0; padding:0; }
    .board { flex:1; border-radius:0; overflow:hidden; background:#050506; }
    .rotate { display:none; position:fixed; inset:0; z-index:30; background:#050507; color:#fff; align-items:center; justify-content:center; text-align:center; padding:24px; font-size:18px; font-weight:650; }
    @media (orientation: portrait) and (max-width: 700px) { .rotate { display:flex; } }
    @media (orientation: landscape) {
      body { flex-direction:row; }
      .board-wrap { min-height:100dvh; height:100dvh; }
      .panel { width:min(320px,38vw); max-height:100dvh; overflow:auto; border-top:0; border-left:1px solid var(--line); padding-top:calc(10px + env(safe-area-inset-top)); }
    }
    canvas { width:100%; height:100%; display:block; touch-action:manipulation; }
    .panel { padding:12px 14px calc(14px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); display:grid; gap:10px; }
    .msg { width:100%; min-height:46px; border:1px solid var(--line); background:var(--card); color:#fff; border-radius:12px; padding:12px 14px; font-size:16px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .ctl { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 10px 6px; }
    .ctl label { display:flex; justify-content:space-between; font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
    .ctl b { color:var(--text); font-weight:650; font-variant-numeric:tabular-nums; }
    input[type=range] { width:100%; height:28px; accent-color:var(--accent); }
    input[type=color] { width:100%; height:46px; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:4px; }
    .actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    button { min-height:46px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; font-size:14px; }
    button.ghost { background:var(--card); color:var(--text); border:1px solid var(--line); }
    button.on { background:#2a1a12; color:#ffb4ae; border-color:#5a2a24; }
    .hint { font-size:11px; color:var(--muted); text-align:center; }
    body.fs { height:100dvh; overflow:hidden; }
    body.fs .panel { display:none !important; }
    body.fs .board-wrap { min-height:100dvh; height:100dvh; padding:0; }
    body.fs .board { border-radius:0; }
  </style>
</head>
<body>
  <div class="board-wrap"><div class="board"><canvas id="led" aria-label="Tablica LED"></canvas></div></div>
  <form class="panel" id="form">
    <input id="msg" class="msg" type="text" autocomplete="off" maxlength="240" value="LED BOARD • WITAJ" />
    <div class="grid3">
      <div class="ctl"><label for="size">Wielkość <b id="sizeVal">18</b></label><input id="size" type="range" min="8" max="56" value="18" /></div>
      <div class="ctl"><label for="thick">Grubość <b id="thickVal">70</b></label><input id="thick" type="range" min="25" max="100" value="70" /></div>
      <div class="ctl"><label for="gap">Odstęp <b id="gapVal">1</b></label><input id="gap" type="range" min="0" max="5" value="1" /></div>
    </div>
    <div class="grid2">
      <div class="ctl"><label for="speed">Prędkość <b id="speedVal">14</b></label><input id="speed" type="range" min="2" max="80" value="14" /></div>
      <div class="ctl"><label for="color">Kolor</label><input id="color" type="color" value="#ff3b30" /></div>
    </div>
    <div class="actions">
      <button type="submit">Start</button>
      <button type="button" class="ghost" id="pause">Pauza</button>
      <button type="button" class="ghost" id="bold">Bold</button>
    </div>
    <button type="button" class="ghost" id="fs" style="width:100%">Pełny ekran</button>
    <p class="hint">Poziomo. Pełny = cała tablica, tap = powrót.</p>
  </form>
  <div class="rotate">Obróć telefon poziomo</div>
  <script src="app.js"></script>
</body>
</html>
