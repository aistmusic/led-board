<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>LED Board</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#050505; --panel:#111; --text:#eee; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
    body { display:flex; flex-direction:column; min-height:100dvh; }
    .board-wrap { flex:1; display:flex; align-items:center; min-height:42vh; padding:env(safe-area-inset-top) 8px 8px; background:#000; }
    canvas { width:100%; height:100%; max-height:46vh; display:block; border-radius:6px; background:#000; }
    .panel { padding:12px 14px calc(16px + env(safe-area-inset-bottom)); background:var(--panel); display:grid; gap:10px; }
    label { font-size:12px; opacity:.7; display:block; margin-bottom:4px; }
    input[type=text] { width:100%; min-height:48px; border:1px solid #333; background:#0a0a0a; color:#fff; border-radius:8px; padding:10px 12px; font-size:16px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .row > div { flex:1; min-width:120px; }
    input[type=range] { width:100%; min-height:32px; }
    button { min-height:48px; min-width:48px; border:0; border-radius:8px; background:#c41212; color:#fff; font-weight:600; font-size:15px; padding:0 16px; }
    button.ghost { background:#222; }
    .hint { font-size:11px; opacity:.45; }
  </style>
</head>
<body>
  <div class="board-wrap"><canvas id="led" aria-label="Tablica LED"></canvas></div>
  <form class="panel" id="form">
    <div>
      <label for="msg">Tekst (poziomo, scroll)</label>
      <input id="msg" type="text" inputmode="text" autocomplete="off" maxlength="240" value="LED BOARD • WITAJ" />
    </div>
    <div class="row">
      <div><label for="speed">Prędkość</label><input id="speed" type="range" min="20" max="220" value="90" /></div>
      <div><label for="color">Kolor</label><input id="color" type="color" value="#ff2a2a" style="width:100%;height:40px;border:0;background:transparent" /></div>
    </div>
    <div class="row">
      <button type="submit">START</button>
      <button type="button" class="ghost" id="fs">PEŁNY EKRAN</button>
    </div>
    <p class="hint">Dodaj do ekranu głównego (Udostępnij → Do ekranu początkowego). Najlepiej poziomo.</p>
  </form>
  <script src="app.js"></script>
</body>
</html>
